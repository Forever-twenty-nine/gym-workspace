<ion-card>
  <ion-card-content>
    @if (isPremium) {
      @if (ejercicios.length > 0) {
        <ion-list lines="none">
          @for (ej of ejercicios; track ej.id) {
            <ion-item-sliding>
              <ion-item>
                <ion-label>
                  <h2>{{ ej.nombre }}</h2>
                </ion-label>
              </ion-item>
              <ion-item-options side="start">
                <ion-item-option color="danger" (click)="onDelete(ej.id)">
                  <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
                </ion-item-option>
              </ion-item-options>
              <ion-item-options side="end">
                <ion-item-option color="primary" (click)="onEdit(ej)">
                  <ion-icon name="pencil-outline" slot="icon-only"></ion-icon>
                </ion-item-option>
              </ion-item-options>
            </ion-item-sliding>
          }
        </ion-list>
      } @else {
        <app-empty-state
          title="Aún no has creado ejercicios."
          message="Usa el botón + para agregar uno.">
        </app-empty-state>
      }
    } @else {
      <app-empty-state
        icon="lock-closed"
        [premium]="true"
        title="Ejercicios (Premium)"
        message="Accede al catálogo completo y crea tus ejercicios personalizados.">
      </app-empty-state>
      <ion-button expand="block" color="warning" fill="clear" (click)="onCreate()">
        Desbloquear Premium
      </ion-button>
    }
  </ion-card-content>
</ion-card>
