<ion-card [class.min-h-\[50vh\]]="type() === 'success'" [class.min-h-\[60vh\]]="type() === 'start'">

    <ion-card-header>
        <ion-avatar [attr.data-type]="type()">
            <ion-icon [name]="icon()" [class.text-6xl]="type() === 'success'" [class.text-4xl]="type() === 'start'"></ion-icon>
        </ion-avatar>
    </ion-card-header>

    <ion-card-header>
        <ion-card-title [class.text-3xl]="type() === 'success'">
            {{ title() }}
        </ion-card-title>
    </ion-card-header>

    <ion-card-content>
        @if (type() === 'start' && yaRealizadaHoy()) {
        <ion-card>
            <ion-card-content>
                <ion-card-subtitle>
                    <ion-icon name="warning-outline"></ion-icon>
                    ¡Ya completaste esta rutina hoy!
                </ion-card-subtitle>
                <p>Puedes volver a repetirla si lo
                    deseas.
                </p>
            </ion-card-content>
        </ion-card>
        } @else {
        <ion-card-subtitle>
            {{ subtitle() }}
        </ion-card-subtitle>
        }
    </ion-card-content>

    @if (!hideButton()) {
    <ion-toolbar>
        <ion-button [expand]="expand()" [fill]="buttonFill()" [color]="buttonColor()" (click)="action.emit()"
            [class.h-14]="type() === 'start'" [class.text-lg]="type() === 'start'">
            {{ buttonText() }}
        </ion-button>
    </ion-toolbar>
    }
</ion-card>
