<ion-card>

    <ion-card-header>
        <!-- Timer (Huge and Centered) -->
        <ion-card-title>
            {{ tiempo() }}
        </ion-card-title>
    </ion-card-header>

    <ion-card-content>
        <!-- Progreso y Estado (Subtle) -->
        <ion-list lines="none">
            <ion-item>
                <ion-label>
                    <span [style.color]="iniciada() ? 'var(--ion-color-warning)' : 'var(--ion-color-medium)'">
                        {{ estado() }}
                    </span>
                </ion-label>
                <ion-note slot="end">{{ porcentaje() }}%</ion-note>
            </ion-item>
            <ion-item lines="none">
                <ion-progress-bar [value]="porcentaje() / 100" color="primary"></ion-progress-bar>
            </ion-item>
        </ion-list>
    </ion-card-content>
</ion-card>
