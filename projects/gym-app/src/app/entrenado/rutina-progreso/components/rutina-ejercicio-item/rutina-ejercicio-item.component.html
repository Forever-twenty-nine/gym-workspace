<ion-card (click)="toggle.emit()" button [attr.data-completado]="completado() ? '' : null">
    <ion-item lines="none">
        <ion-avatar slot="start" [attr.data-completado]="completado() ? '' : null">
            <ion-icon [name]="completado() ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
        </ion-avatar>
        <ion-label>
            <h4 [attr.data-completado]="completado() ? '' : null"
                [class.line-through]="completado()">
                {{ ejercicio().nombre }}
            </h4>
            <p>
                {{ ejercicio().series }} series x {{ ejercicio().repeticiones }} reps
                @if (ejercicio().descansoSegundos) {
                    <span>•</span> {{ ejercicio().descansoSegundos }}s descanso
                }
            </p>
        </ion-label>
        <ion-button slot="end" fill="clear" (click)="showDetails.emit(); $event.stopPropagation()">
            <ion-icon slot="icon-only" name="information-circle-outline"></ion-icon>
        </ion-button>
    </ion-item>
</ion-card>
