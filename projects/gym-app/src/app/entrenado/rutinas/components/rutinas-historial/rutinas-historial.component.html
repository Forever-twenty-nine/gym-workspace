<ion-card>
  <ion-card-header>
    <ion-card-title>Rutinas completadas</ion-card-title>
    <ion-card-subtitle>{{ sesiones.length }} rutinas</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    @if (sesiones.length > 0) {
      <ion-list>
        @for (sesion of sesiones; track sesion.id) {
          <ion-item-sliding>
            <ion-item button detail="true" (click)="onVerDetalle(sesion)">
              <app-date-badge slot="start" [fecha]="sesion.fechaInicio"></app-date-badge>
              <ion-label>
                @if (sesion.duracion) {
                  <h2>{{ redondearMinutos(sesion.duracion) }} min</h2>
                } @else {
                  <h2>Completada</h2>
                }
                <p>{{ sesion.rutinaResumen.ejercicios.length || 0 }} ejercicios</p>
              </ion-label>
            </ion-item>

            <ion-item-options side="start">
              <ion-item-option color="danger" (click)="onEliminar(sesion, $event)">
                <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
              </ion-item-option>
            </ion-item-options>
          </ion-item-sliding>
        }
      </ion-list>
    } @else {
      <app-empty-state
        icon="calendar-outline"
        title="Aún no hay rutinas completadas"
        message="Cuando termines una rutina aparecerá aquí." />
    }
  </ion-card-content>
</ion-card>
