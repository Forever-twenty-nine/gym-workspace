<ion-card>
  <ion-card-header>
    <ion-card-title>Próximas Rutinas</ion-card-title>
    <ion-button fill="clear" (click)="verTodas.emit()">
      Ver todas
    </ion-button>
  </ion-card-header>

  <ion-card-content>
    @if (rutinas.length > 0) {
    <ion-list lines="none">
      @for (rutina of rutinas; track rutina.id || rutina.nombre) {
      <ion-item button [detail]="false" [disabled]="!rutina.esEjecutable" (click)="verDetalle.emit(rutina)">
        <app-date-badge slot="start" [fecha]="rutina.fecha" [esEjecutable]="rutina.esEjecutable ?? false"
          [diaCorto]="rutina.diaCorto">
        </app-date-badge>

        <ion-label>
          <h2>{{ rutina.nombre }}</h2>
        </ion-label>

        @if (rutina.esEjecutable) {
        <ion-icon slot="end" name="play-circle" color="primary" size="large"></ion-icon>
        } @else {
        <ion-icon slot="end" name="chevron-forward" color="medium"></ion-icon>
        }
      </ion-item>
      }
    </ion-list>
    } @else {
      <app-empty-state
        icon="barbell-outline"
        title="No tienes rutinas asignadas"
        [message]="entrenador
          ? 'Tu entrenador te asignará rutinas pronto.'
          : 'Busca un entrenador para recibir rutinas personalizadas.'" />
    }
  </ion-card-content>
</ion-card>
