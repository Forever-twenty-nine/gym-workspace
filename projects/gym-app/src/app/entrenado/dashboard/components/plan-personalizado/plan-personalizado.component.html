<ion-card>
  <ion-grid>
    <ion-row>

      <ion-col size="4">
        <ion-note>Nivel</ion-note>
        <ion-text>{{ nivel || '—' }}</ion-text>
      </ion-col>

      <ion-col size="4">
        <ion-note>Objetivo</ion-note>
        <ion-text [title]="objetivo">{{ objetivo || '—' }}</ion-text>
      </ion-col>

      <ion-col size="4">
        <ion-note>Frecuencia</ion-note>
        <ion-text>{{ frecuencia || 0 }} <small>d/sem</small></ion-text>
      </ion-col>

    </ion-row>
  </ion-grid>

  @if (entrenadorAsignado) {
    <ion-item lines="none">
      <ion-avatar slot="start">
        <img [src]="photoURL || 'assets/images/avatar-placeholder.png'" alt="Avatar">
      </ion-avatar>
      <ion-label>
        <p>{{ entrenadorAsignado }}</p>
      </ion-label>
      <ion-note slot="end" color="medium">Entrenador</ion-note>
    </ion-item>
  }
</ion-card>
