<ion-card>
  <ion-grid>
    <ion-row>

      <ion-col size="4">
        <ion-text color="medium">
          <p>Nivel</p>
        </ion-text>
        <ion-badge color="secondary">
          {{ nivel || 'No definido' }}
        </ion-badge>
      </ion-col>

      <ion-col size="4">
        <ion-text color="medium">
          <p>Objetivo</p>
        </ion-text>
        <ion-badge color="secondary" [title]="objetivo">
          {{ objetivo || 'No definido' }}
        </ion-badge>
      </ion-col>

      <ion-col size="4">
        <ion-text color="medium">
          <p>Frecuencia</p>
        </ion-text>
        <ion-badge color="secondary">
          {{ frecuencia || '0' }} d/sem
        </ion-badge>
      </ion-col>

    </ion-row>
  </ion-grid>

  @if (entrenadorAsignado) {
    <ion-item lines="none">
      <ion-avatar slot="start">
        <img [src]="photoURL || 'assets/images/avatar-placeholder.png'" alt="Avatar">
      </ion-avatar>
      <ion-label>
        <p>{{ entrenadorAsignado }}</p>
      </ion-label>
      <ion-note slot="end" color="medium">Entrenador</ion-note>
    </ion-item>
  }
</ion-card>
