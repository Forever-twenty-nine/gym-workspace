@if (isLoading()) {
  <ion-card>
    <ion-card-content>
      <app-empty-state title="Cargando actividad..." [loading]="true" />
    </ion-card-content>
  </ion-card>
} @else if (filteredFeed().length === 0) {
  <ion-card>
    <ion-card-content>
      <app-empty-state
        icon="newspaper-outline"
        [title]="tab === 'para-ti' ? 'Cero actividad aún' : 'No sigues a nadie aún'"
        [message]="tab === 'para-ti' ? '¡Entrena hoy y comparte tu progreso con el resto!' : 'Sigue a otros atletas para ver su actividad aquí.'" />
    </ion-card-content>
  </ion-card>
}

<!-- FEED ACTIVO -->
@else {
  <ion-list lines="none">
    @for (item of filteredFeed(); track item.id) {
      <ion-item>
        <app-social-card [sesion]="item"></app-social-card>
      </ion-item>
    }
  </ion-list>

  <!-- Scroll Infinito -->
  @if (hasMoreItems()) {
    <ion-infinite-scroll threshold="100px" (ionInfinite)="loadMore($event)">
      <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Cargando más actividades...">
      </ion-infinite-scroll-content>
    </ion-infinite-scroll>
  }
}
