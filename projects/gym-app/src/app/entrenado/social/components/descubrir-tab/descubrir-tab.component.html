<ion-card>
  @if (tarjetaActiva) {
  <ion-card-content>

    <!-- Contenedor de la Tarjeta con Animación de Deslizamiento -->
    <ion-card [class]="animacionCard()" (transitionend)="onCardTransitionEnd()">
      <app-match-card [tipo]="tarjetaActiva.tipo" [data]="tarjetaActiva.data">
      </app-match-card>
    </ion-card>

    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col>
            <!-- Botón Pasar (Descartar) -->
            <ion-button (click)="onPasar()" color="secondary" fill="outline">
              <ion-icon name="close"></ion-icon>
            </ion-button>
          </ion-col>

          <ion-col>
            <ion-button (click)="onChocarLos5()" color="primary" fill="solid">
              <ion-icon name="hand-right"></ion-icon>
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>

  </ion-card-content>
  } @else {
  <!-- Estado Vacío del Mazo -->
  <ion-card>
    <ion-card-content>
      <ion-avatar>
        <ion-icon name="sparkles-outline"></ion-icon>
      </ion-avatar>
      <ion-card-title>¡Eso es todo por hoy!</ion-card-title>
      <ion-card-subtitle>
        Has completado tu mazo de sugerencias. Vuelve más tarde para ver nuevos compañeros o desafíos disponibles en tu gimnasio.
      </ion-card-subtitle>
    </ion-card-content>
  </ion-card>
  }
</ion-card>
