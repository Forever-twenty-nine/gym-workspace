<ion-card>
  <!-- Foto de Perfil con Fallback -->
  @if(safePhoto()) {
  <ion-img [src]="safePhoto()" alt="Perfil" (error)="onPhotoError()"></ion-img>
  } @else {
  <ion-card-content>
    <ion-icon name="person"></ion-icon>
  </ion-card-content>
  }

  <ion-card-header>
    @if (userName()) {
    <ion-card-title>{{ userName() }}</ion-card-title>
    }
    @if(data()?.bio) {
    <ion-card-subtitle>{{ data().bio }}</ion-card-subtitle>
    }@else {
    <p>Sin Descripción</p>
    }
  </ion-card-header>

  <ion-card-content>
    @for (reason of matchReasons(); track reason) {
    <ion-chip outline color="medium">
      <ion-label>{{ reason }}</ion-label>
    </ion-chip>
    }
  </ion-card-content>
</ion-card>
