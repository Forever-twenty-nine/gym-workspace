<ion-modal [isOpen]="true" (ionModalDidDismiss)="onDidDismiss()">
  <ng-template>
    <ion-card>

      <ion-card-header>
        <ion-card-title>¡Conexión Realizada!</ion-card-title>
        <ion-card-subtitle>Nueva coincidencia para entrenar</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <!-- Avatares Simples -->
        <ion-list lines="none">
          <ion-item>
            <!-- Mi Foto -->
            <ion-avatar slot="start">
              @if (currentUserPhoto) {
              <img [src]="currentUserPhoto" alt="Mi Foto">
              } @else {
              <span>Tú</span>
              }
            </ion-avatar>

            <ion-label>Y</ion-label>

            <!-- Foto de Partner -->
            <ion-avatar slot="end">
              @if (partnerPhoto) {
              <img [src]="partnerPhoto" [alt]="matchActual.partnerName">
              } @else {
              <span>Socio</span>
              }
            </ion-avatar>
          </ion-item>
        </ion-list>

        <!-- Mensaje Contextual -->
        @if (matchMessage) {
        <ion-label>
          "{{ matchMessage }}"
        </ion-label>
        }
      </ion-card-content>


      <ion-button (click)="onIniciarChat()" fill="outline" color="primary">
        Coordinar por Chat
      </ion-button>

      <ion-button (click)="onCerrarMatch()" fill="outline" color="medium">
        Seguir Buscando
      </ion-button>

    </ion-card>
  </ng-template>
</ion-modal>
