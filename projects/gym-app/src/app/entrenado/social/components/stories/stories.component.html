@if (stories.length > 0) {
<ion-list lines="none">
  <ion-item>
    @for (story of stories; track story.id) {
    @if (story.type === 'convocatoria') {
    <!-- Convocatoria circle -->
    <ion-avatar button (click)="storyClick.emit(story)">
      @if (story.photoUrl) {
      <img [src]="story.photoUrl" alt="Creador">
      } @else {
      <ion-icon name="person-outline" color="primary"></ion-icon>
      }
    </ion-avatar>
    } @else {
    <!-- Desafío circle -->
    <ion-avatar button (click)="storyClick.emit(story)">
      @if (story.photoUrl) {
      <img [src]="story.photoUrl" alt="">
      } @else {
      <ion-icon name="trophy-outline" color="primary"></ion-icon>
      }
    </ion-avatar>
    }
    }
  </ion-item>
</ion-list>
}
