<ion-content [fullscreen]="true" style="--background: transparent;">
  <app-background />

  <div style="position: relative; z-index: 10; padding: 24px 16px; max-width: 512px; margin: 0 auto;">

    <div style="margin-bottom: 24px;">
      <h2 style="font-size: 1.25rem; font-weight: 800; margin: 0;">Mi Gimnasio</h2>
      <span style="font-size: 0.625rem; font-weight: 800; color: var(--ion-color-primary); letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-top: 2px;">Panel principal</span>
    </div>

    <ion-card class="ion-no-margin">
      <ion-card-content style="padding: 24px 16px; text-align: center;">
        <ion-icon name="bar-chart-outline" color="primary" style="font-size: 3rem;"></ion-icon>
        <h3 style="font-size: 1rem; font-weight: 700; margin: 12px 0 4px;">Tus estadísticas están en tu perfil</h3>
        <p style="font-size: 0.875rem; color: var(--ion-color-medium); margin: 0; line-height: 1.4;">
          Desde la pestaña <strong>Perfil &rarr; Estadísticas</strong> podés ver la distribución de tus entrenadores
          y entrenados, métricas de activación y mucho más.
        </p>
      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
