<ion-content [fullscreen]="true" class="transparent-bg">
  <app-background />

  <ion-grid fixed class="dashboard-container ion-padding">
    
    <!-- Cabecera del Panel -->
    <ion-row class="ion-align-items-center ion-margin-bottom">
      <ion-col>
        <h2 class="dashboard-title">Mi Gimnasio</h2>
        <ion-text color="primary">
          <span class="dashboard-subtitle">Panel principal</span>
        </ion-text>
      </ion-col>
    </ion-row>

    <!-- Gestión de Tipos de Entrenamiento -->
    <ion-row>
      <ion-col class="ion-no-padding">
        <app-tipos-entrenamiento-manager></app-tipos-entrenamiento-manager>
      </ion-col>
    </ion-row>

    <!-- Tarjeta de Estadísticas Informativa -->
    <ion-row class="ion-margin-top">
      <ion-col class="ion-no-padding">
        <ion-card class="ion-no-margin premium-stats-card">
          <ion-item lines="none" class="ion-padding-vertical">
            <ion-icon name="bar-chart-outline" color="primary" slot="start" size="large"></ion-icon>
            <ion-label class="ion-text-wrap">
              <h3 class="ion-text-bold">Estadísticas del gimnasio</h3>
              <p>
                Para ver la distribución de entrenadores, alumnos y métricas de activación, ve a <strong>Perfil &rarr; Estadísticas</strong>.
              </p>
            </ion-label>
          </ion-item>
        </ion-card>
      </ion-col>
    </ion-row>

  </ion-grid>
</ion-content>
