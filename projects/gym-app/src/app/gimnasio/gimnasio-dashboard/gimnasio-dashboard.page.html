<ion-content [fullscreen]="true" style="--background: transparent;">
  <app-background />

  <div style="position: relative; z-index: 10; padding: 24px 16px; max-width: 512px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;">

    <!-- Cabecera del Panel -->
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 800; margin: 0;">Mi Gimnasio</h2>
        <span style="font-size: 0.625rem; font-weight: 800; color: var(--ion-color-primary); letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-top: 2px;">Panel principal</span>
      </div>
      <ion-button (click)="crearTipo()" size="small" fill="clear" style="margin: 0;">
        <ion-icon name="add" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    <!-- Lista y gestión de Tipos de Entrenamiento -->
    <app-tipos-entrenamiento-list
      [tipos]="tipos()"
      (edit)="editarTipo($event)"
      (delete)="eliminarTipo($event)"
      (loadDefaults)="cargarPredeterminados()">
    </app-tipos-entrenamiento-list>

    <!-- Modal de Creación/Edición -->
    <app-tipo-entrenamiento-modal
      [isOpen]="isModalOpen()"
      [tipo]="modalData()"
      [isCreating]="isCreating()"
      (close)="closeModal()"
      (save)="saveChanges($event)">
    </app-tipo-entrenamiento-modal>

    <!-- Tarjeta de Estadísticas Informativa -->
    <ion-card class="ion-no-margin" style="border: 1px solid var(--ion-color-step-100, #f4f5f8); box-shadow: 0 2px 8px rgba(0,0,0,0.02);">
      <ion-card-content style="padding: 16px; display: flex; align-items: center; gap: 16px;">
        <ion-icon name="bar-chart-outline" color="primary" style="font-size: 2rem; flex-shrink: 0;"></ion-icon>
        <div style="text-align: left;">
          <h3 style="font-size: 0.9rem; font-weight: 700; margin: 0 0 2px;">Estadísticas del gimnasio</h3>
          <p style="font-size: 0.75rem; color: var(--ion-color-medium); margin: 0; line-height: 1.3;">
            Para ver la distribución de entrenadores, alumnos y métricas de activación, ve a <strong>Perfil &rarr; Estadísticas</strong>.
          </p>
        </div>
      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
