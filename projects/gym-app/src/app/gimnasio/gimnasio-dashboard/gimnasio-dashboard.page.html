<ion-content [fullscreen]="true">
  <app-background />

  <ion-grid fixed>
    <ion-row>
      <ion-col>
        <ion-text>
          <h2>Mi Gimnasio</h2>
        </ion-text>
        <ion-text color="primary">
          <span>Panel principal</span>
        </ion-text>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <app-tipos-entrenamiento-manager></app-tipos-entrenamiento-manager>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <ion-card>
          <ion-item lines="none">
            <ion-icon name="bar-chart-outline" color="primary" slot="start" size="large"></ion-icon>
            <ion-label>
              <h3>Estadísticas del gimnasio</h3>
              <p>
                Para ver la distribución de entrenadores, alumnos y métricas de activación, ve a <strong>Perfil &rarr; Estadísticas</strong>.
              </p>
            </ion-label>
          </ion-item>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
