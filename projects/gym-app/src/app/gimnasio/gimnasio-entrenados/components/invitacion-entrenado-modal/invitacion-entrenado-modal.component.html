<ion-modal [isOpen]="isOpen()" (didDismiss)="cancel()">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="cancel()">
            <ion-icon name="close-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
        <ion-title>Invitar Entrenado</ion-title>
        <ion-buttons slot="end">
          <ion-button [disabled]="inviteForm().invalid || isLoading()" (click)="submit()" fill="solid" color="primary">
            <ion-icon name="send" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <form [formGroup]="inviteForm()">
        <ion-item>
          <ion-select label="Entrenador" labelPlacement="stacked" placeholder="Selecciona un entrenador" formControlName="entrenadorId">
            @for (trainer of gymTrainers(); track trainer.uid) {
              <ion-select-option [value]="trainer.uid">{{ trainer.nombre || trainer.email }}</ion-select-option>
            }
          </ion-select>
        </ion-item>

        <ion-item>
          <ion-input label="Correo del entrenado" labelPlacement="stacked" type="email" placeholder="ejemplo@correo.com" formControlName="email"></ion-input>
        </ion-item>

        <ion-searchbar placeholder="Buscar usuario por nombre o email..."
                       (ionInput)="searchTrainees($event)"
                       (ionClear)="clearSearchResults()"></ion-searchbar>

        @if (searchResults().length > 0) {
          <ion-list>
            @for (user of searchResults(); track user.uid) {
              <ion-item button (click)="selectTrainee(user)">
                <ion-avatar slot="start">
                  <img [src]="user.photoURL || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + user.uid" />
                </ion-avatar>
                <ion-label>
                  <h2>{{ user.nombre || 'Sin nombre' }}</h2>
                  <p>{{ user.email }}</p>
                </ion-label>
              </ion-item>
            }
          </ion-list>
        }

        <ion-item>
          <ion-textarea label="Mensaje opcional" labelPlacement="stacked" rows="3" placeholder="¡Hola! Te invito a unirte como mi entrenado..." formControlName="mensaje"></ion-textarea>
        </ion-item>
      </form>
    </ion-content>
  </ng-template>
</ion-modal>
