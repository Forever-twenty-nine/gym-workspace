@for (group of groupedUsers(); track group.trainerName) {
  <ion-list-header>
    <ion-label>{{ group.trainerName }}</ion-label>
  </ion-list-header>

  <ion-list>
    @for (user of group.users; track user.uid) {
      <app-list-item
        [photo]="user.photoURL || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + user.uid"
        [name]="user.nombre || 'Usuario sin nombre'" />
    }
  </ion-list>
} @empty {
  <app-empty-state
    title="No se encontraron entrenados."
    message="Cuando vincules uno aparecerá aquí." />
}
