<ion-list>
  @for (user of entrenadores(); track user.uid) {
    <app-list-item
      [photo]="user.photoURL || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + user.uid"
      [name]="user.nombre || 'Usuario sin nombre'">
      <ion-button slot="end" fill="clear" color="danger" (click)="desvincular.emit(user)">
        <ion-icon slot="icon-only" name="person-remove"></ion-icon>
      </ion-button>
    </app-list-item>
  } @empty {
    <app-empty-state
      title="No se encontraron entrenadores."
      message="Cuando vincules uno aparecerá aquí." />
  }
</ion-list>
