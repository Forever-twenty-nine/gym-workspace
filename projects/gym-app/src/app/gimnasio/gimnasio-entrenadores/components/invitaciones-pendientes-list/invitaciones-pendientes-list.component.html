@if (invitaciones().length > 0) {
  <ion-card class="ion-margin-top ion-no-margin">
    <ion-card-header>
      <ion-card-title style="font-size: 0.8rem; text-transform: uppercase; text-align: center;">
        Invitaciones Pendientes
      </ion-card-title>
    </ion-card-header>
    
    <ion-list style="background: transparent;">
      @for (invitacion of invitaciones(); track invitacion.id) {
        <ion-item lines="full" style="--background: transparent;">
          <ion-avatar slot="start" style="border: 1px solid var(--ion-color-step-150, #d7d8da);">
            <img [src]="'https://api.dicebear.com/7.x/avataaars/svg?seed=' + invitacion.id" />
          </ion-avatar>
          <ion-label>
            <h3 style="font-weight: bold; margin: 0;">{{ invitacion.entrenadorNombre || invitacion.emailDestinatario }}</h3>
            <p style="font-size: 0.8rem; margin: 4px 0;">{{ invitacion.emailDestinatario }}</p>
            <p style="font-size: 0.7rem; color: var(--ion-color-medium);">
              Enviada el {{ invitacion.fechaCreacion | date:'dd/MM/yyyy HH:mm' }}
            </p>
          </ion-label>
          <ion-button slot="end" fill="clear" color="danger" (click)="cancelar.emit(invitacion.id)">
            <ion-icon name="close-circle-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-item>
      }
    </ion-list>
  </ion-card>
}
