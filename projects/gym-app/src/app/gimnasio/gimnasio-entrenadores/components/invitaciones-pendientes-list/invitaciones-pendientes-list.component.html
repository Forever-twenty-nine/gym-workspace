@if (invitaciones().length > 0) {
  <ion-card>
    <ion-card-header>
      <ion-card-title>Invitaciones Pendientes</ion-card-title>
    </ion-card-header>

    <ion-list>
      @for (invitacion of invitaciones(); track invitacion.id) {
        <ion-item lines="full">
          <ion-avatar slot="start">
            <img [src]="'https://api.dicebear.com/7.x/avataaars/svg?seed=' + invitacion.id" />
          </ion-avatar>
          <ion-label>
            <h3>{{ invitacion.entrenadorNombre || invitacion.emailDestinatario }}</h3>
            <p>{{ invitacion.emailDestinatario }}</p>
            <p>Enviada el {{ invitacion.fechaCreacion | date:'dd/MM/yyyy HH:mm' }}</p>
          </ion-label>
          <ion-button slot="end" fill="clear" color="danger" (click)="cancelar.emit(invitacion.id)">
            <ion-icon name="close-circle-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-item>
      }
    </ion-list>
  </ion-card>
}
