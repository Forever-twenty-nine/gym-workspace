@if (invitaciones().length > 0) {
  <ion-card class="ion-margin-top ion-no-margin">
    <ion-card-header>
      <ion-card-title class="list-title-96">
        Invitaciones Pendientes
      </ion-card-title>
    </ion-card-header>
    
    <ion-list class="bg-transparent">
      @for (invitacion of invitaciones(); track invitacion.id) {
        <ion-item class="transparent-bg" lines="full">
          <ion-avatar class="card-avatar-85" slot="start">
            <img [src]="'https://api.dicebear.com/7.x/avataaars/svg?seed=' + invitacion.id" />
          </ion-avatar>
          <ion-label>
            <h3 class="font-bold m-0">{{ invitacion.entrenadorNombre || invitacion.emailDestinatario }}</h3>
            <p class="list-p-97">{{ invitacion.emailDestinatario }}</p>
            <p class="text-[0.7rem] text-[var(--ion-color-medium)]">
              Enviada el {{ invitacion.fechaCreacion | date:'dd/MM/yyyy HH:mm' }}
            </p>
          </ion-label>
          <ion-button slot="end" fill="clear" color="danger" (click)="cancelar.emit(invitacion.id)">
            <ion-icon name="close-circle-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-item>
      }
    </ion-list>
  </ion-card>
}
