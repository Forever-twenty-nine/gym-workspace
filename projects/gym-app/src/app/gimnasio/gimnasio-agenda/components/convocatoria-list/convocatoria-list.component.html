<div style="display: flex; flex-direction: column; gap: 16px;">
  @for (item of items(); track item.convocatoria.id) {
    <app-convocatoria-card
      [convocatoria]="item.convocatoria"
      [creadorName]="item.creadorName"
      [creadorPhoto]="item.creadorPhoto"
      [fechaFormateada]="item.fechaFormateada"
      [asistentes]="item.asistentes">
    </app-convocatoria-card>
  } @empty {
    <!-- Estado vacío -->
    <ion-card class="ion-text-center ion-padding">
      <ion-card-content>
        <ion-icon [name]="emptyIcon()" color="medium" style="font-size: 4rem; margin-bottom: 16px;"></ion-icon>
        <ion-text>
          <h3 style="font-weight: bold; margin: 0; margin-bottom: 8px;">{{ emptyTitle() }}</h3>
        </ion-text>
        <ion-text color="medium">
          <p style="margin: 0;">{{ emptyMessage() }}</p>
        </ion-text>
      </ion-card-content>
    </ion-card>
  }
</div>
