<!--
  background: capa fija de fondo condicional (premium = imagen, default = gradient).
  Estructura justificada: 1 <div> por rama con bg-image o linear-gradient aplicado via CSS.
-->
@if (isPremiumEffective() && effectiveImage()) {
  <div>
    <ion-img [src]="effectiveImage()!" alt="background"></ion-img>
  </div>
} @else {
  <div></div>
}
