@if (isPremiumEffective() && effectiveImage()) {
  <div style="position: fixed; inset: 0; opacity: 0.25; pointer-events: none; z-index: 0;">
    <img [src]="effectiveImage()!" alt="background"
      style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
  </div>
} @else {
  <div
    style="position: fixed; inset: 0; background: linear-gradient(135deg, #1e3a8a, #15803d, #1e3a8a); pointer-events: none; z-index: 0;">
  </div>
}
