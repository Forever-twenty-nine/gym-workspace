<!--
  auth-background: capa fija de full-screen.
  Estructura justificada: 1 <div> raíz posicionado absoluto + 1 <div> overlay.
  Migrar a host element requeriría añadir ::after con gradient + bg-image al host,
  perdería la capacidad de alternar entre imagen y overlay con un solo binding.
-->
<div [attr.data-blur]="showBlur ? true : null">
  <img src="/assets/images/bg.jpg" alt="" />
</div>
@if (opacityClass.trim()) {
  <span [attr.data-overlay]="opacityClass.trim()"></span>
}
