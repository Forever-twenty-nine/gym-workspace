<ion-modal
  [isOpen]="isOpen()"
  (willDismiss)="close.emit()"
  [breakpoints]="breakpoints() ?? undefined"
  [initialBreakpoint]="initialBreakpoint() ?? undefined"
  [backdropDismiss]="backdropDismiss()">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="close.emit()">
            <ion-icon name="close" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
        <ion-title>{{ title() }}</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="save.emit()" [disabled]="disabled()">
            <ion-icon name="save-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ng-content></ng-content>
    </ion-content>
  </ng-template>
</ion-modal>
