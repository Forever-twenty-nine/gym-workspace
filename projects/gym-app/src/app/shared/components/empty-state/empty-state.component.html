<section [class.is-premium]="premium()" [class.is-loading]="loading()">
  @if (loading()) {
    <ion-spinner name="crescent"></ion-spinner>
  } @else if (icon()) {
    <ion-icon [name]="icon()"></ion-icon>
  }
  <ion-text color="medium">
    <h3>{{ title() }}</h3>
    <p>{{ message() }}</p>
  </ion-text>
</section>
