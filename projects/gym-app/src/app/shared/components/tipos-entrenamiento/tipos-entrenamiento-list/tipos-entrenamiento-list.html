@if (tipos.length === 0) {
  <ion-item lines="none">
    <ion-label>
      <p>Aún no has configurado tipos de entrenamiento para tu gimnasio. Los encuentros y agendas usarán los valores predeterminados.</p>
      <ion-button expand="block" fill="outline" (click)="onLoadDefaults()">Cargar Predeterminados</ion-button>
    </ion-label>
  </ion-item>
} @else {
  <ion-list lines="none">
    @for (tipo of tipos; track tipo.id) {
      <ion-item-sliding #slidingItem>
        <ion-item>
          <ion-label>
            <h2>{{ tipo.nombre }}</h2>
          </ion-label>
        </ion-item>

        <ion-item-options side="start">
          <ion-item-option color="danger" (click)="onDelete(tipo); slidingItem.close()">
            <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
          </ion-item-option>
        </ion-item-options>

        <ion-item-options side="end">
          <ion-item-option color="primary" (click)="onEdit(tipo); slidingItem.close()">
            <ion-icon name="pencil-outline" slot="icon-only"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    }
  </ion-list>
}
