<ion-modal [isOpen]="isOpen()" (didDismiss)="close.emit()">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="close.emit()">
            <ion-icon name="close" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
        <ion-title>{{ isCreating() ? 'Nuevo Tipo' : 'Editar Tipo' }}</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="onSave()" [disabled]="isSaveDisabled()" color="primary" fill="solid" shape="round">
            <ion-icon name="checkmark" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    @if (form(); as f) {
      <form [formGroup]="f">
        <ion-list lines="none">
          <ion-item>
            <ion-input
              label="NOMBRE DEL TIPO"
              labelPlacement="stacked"
              type="text"
              formControlName="nombre"
              placeholder="Ej: WOD, Yoga, Fuerza, Funcional"
            ></ion-input>
          </ion-item>
        </ion-list>
      </form>
    }
  </ng-template>
</ion-modal>
