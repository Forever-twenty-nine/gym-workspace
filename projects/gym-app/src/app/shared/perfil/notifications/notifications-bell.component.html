<!-- Contenedor relativo para poder posicionar el badge en la esquina -->
<div
  style="
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  "
>
  <ion-button
    fill="clear"
    [color]="iconColor()"
    [attr.aria-label]="ariaLabel()"
    (click)="onClick()"
    style="--padding-start: 6px; --padding-end: 6px; margin: 0"
  >
    <ion-icon
      slot="icon-only"
      name="notifications-outline"
      style="font-size: 22px"
    ></ion-icon>
  </ion-button>

  <!-- Badge posicionado en la esquina superior derecha del icono -->
  @if (hasUnread()) {
    <span
      role="status"
      [attr.aria-label]="count() + ' notificaciones no leídas'"
      style="
        position: absolute;
        top: 0;
        right: 0;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border-radius: 9px;
        background: var(--ion-color-danger);
        color: var(--ion-color-danger-contrast);
        font-size: 10px;
        font-weight: 800;
        line-height: 18px;
        text-align: center;
        box-shadow: 0 0 0 2px var(--ion-background-color, #121212);
        pointer-events: none;
        transform: translate(2px, -2px);
        z-index: 1;
      "
    >
      {{ displayCount() }}
    </span>
  }
</div>
