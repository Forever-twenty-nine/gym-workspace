<!-- Contenedor relativo para poder posicionar el badge en la esquina -->
<div class="bell-div-171">
  <ion-button class="bell-button-172" fill="clear" [color]="iconColor()" [attr.aria-label]="ariaLabel()" (click)="onClick()">
    <ion-icon class="bell-icon-173" slot="icon-only" name="notifications-outline"></ion-icon>
  </ion-button>

  <!-- Badge posicionado en la esquina superior derecha del icono -->
  @if (hasUnread()) {
    <span class="bell-span-174" role="status" [attr.aria-label]="count() + ' notificaciones no leídas'">
      {{ displayCount() }}
    </span>
  }
</div>
