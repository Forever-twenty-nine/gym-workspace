<ion-header class="ion-no-border">
  <ion-toolbar class="px-2">
    <ion-title>Aviso del Sistema</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card class="ion-no-margin global-modal-card-167">
    <ion-card-header class="ion-text-center">
      <div class="global-modal-div-168">
        <ion-icon name="information-circle" color="primary"></ion-icon>
      </div>
      <ion-card-title class="global-modal-title-169">
        {{ mensaje.titulo }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content class="ion-text-center global-modal-content-170">
      {{ mensaje.mensaje }}
    </ion-card-content>
  </ion-card>
</ion-content>

<ion-footer class="ion-no-border ion-padding">
  <ion-button expand="block" (click)="dismiss()"> Entendido </ion-button>
</ion-footer>
