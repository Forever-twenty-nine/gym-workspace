<ion-card class="ion-no-margin ion-text-center">
  <ion-card-header>
    <ion-card-subtitle class="status-subtitle-188">Tu Plan Actual</ion-card-subtitle
    >
    <ion-card-title class="text-3xl font-black" [color]="isPremium() ? 'success' : 'dark'">
      {{ plan() ? (plan()! | uppercase) : "FREE" }}
    </ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <p class="text-xs">
      @if (isPremium()) {
        Tenés acceso ilimitado a todas las herramientas, estadísticas de
        entrenamiento y rutinas exclusivas.
      } @else {
        Tenés una cuenta gratuita con acceso básico a entrenamientos.
      }
    </p>
  </ion-card-content>
</ion-card>
