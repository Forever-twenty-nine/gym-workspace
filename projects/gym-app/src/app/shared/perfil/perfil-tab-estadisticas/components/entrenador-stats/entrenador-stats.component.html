<div class="stats-container">
  <!-- Gráfica de Área (Sesiones) -->
  <ion-card class="ion-no-margin ion-margin-bottom">
    <ion-card-header style="padding-top: 24px; padding-bottom: 8px; text-align: center;">
      <ion-card-title style="font-size: 1.1rem; font-weight: 700;">Actividad de tus alumnos (7 días)</ion-card-title>
    </ion-card-header>
    <ion-card-content style="padding-bottom: 0px">
      <apx-chart
        [series]="chartOptions().series"
        [chart]="chartOptions().chart"
        [dataLabels]="chartOptions().dataLabels"
        [plotOptions]="chartOptions().plotOptions"
        [xaxis]="chartOptions().xaxis"
        [yaxis]="chartOptions().yaxis"
        [colors]="chartOptions().colors"
        [theme]="chartOptions().theme"
      ></apx-chart>
    </ion-card-content>
  </ion-card>

  <!-- Gráfica de Objetivos (Donut) -->
  <ion-card class="ion-no-margin ion-margin-bottom">
    <ion-card-header style="padding-top: 24px; padding-bottom: 8px; text-align: center;">
      <ion-card-title style="font-size: 1.1rem; font-weight: 700;">Objetivos</ion-card-title>
    </ion-card-header>
    <ion-card-content style="padding-bottom: 0px">
      <apx-chart
        [series]="objetivosChartOptions().series"
        [chart]="objetivosChartOptions().chart"
        [labels]="objetivosChartOptions().labels"
        [colors]="objetivosChartOptions().colors"
        [plotOptions]="objetivosChartOptions().plotOptions"
        [dataLabels]="objetivosChartOptions().dataLabels"
        [theme]="objetivosChartOptions().theme"
      ></apx-chart>
    </ion-card-content>
  </ion-card>

  <!-- Gráfica de Nivel (Pie) -->
  <ion-card class="ion-no-margin ion-margin-bottom">
    <ion-card-header style="padding-top: 24px; padding-bottom: 8px; text-align: center;">
      <ion-card-title style="font-size: 1.1rem; font-weight: 700;">Nivel de Experiencia</ion-card-title>
    </ion-card-header>
    <ion-card-content style="padding-bottom: 0px">
      <apx-chart
        [series]="nivelChartOptions().series"
        [chart]="nivelChartOptions().chart"
        [labels]="nivelChartOptions().labels"
        [colors]="nivelChartOptions().colors"
        [dataLabels]="nivelChartOptions().dataLabels"
        [theme]="nivelChartOptions().theme"
      ></apx-chart>
    </ion-card-content>
  </ion-card>
</div>
