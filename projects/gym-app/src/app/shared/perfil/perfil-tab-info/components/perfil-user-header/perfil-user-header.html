<ion-item lines="none" class="ion-no-padding">
  <ion-thumbnail slot="start">
    @if (user().photoURL) {
      <img
        src="{{ user().photoURL }}"
        width="64"
        height="64"
        alt="Foto de perfil"
      />
    } @else {
      <ion-icon name="person-outline"></ion-icon>
    }
  </ion-thumbnail>
  <ion-label class="ion-label-182">
    <h2>{{ user().username || "" }}</h2>
  </ion-label>
  <ion-note slot="end">{{ user().userRole || "" }}</ion-note>

</ion-item>
