<ion-card>
  <ion-card-header>
    <ion-card-subtitle>Tu Plan Actual</ion-card-subtitle>
    <ion-card-title [color]="isPremium() ? 'success' : 'dark'">
      {{ plan() ? (plan()! | uppercase) : "FREE" }}
    </ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <p>
      @if (isPremium()) {
        Tenés acceso ilimitado a todas las herramientas, estadísticas de
        entrenamiento y rutinas exclusivas.
      } @else {
        Tenés una cuenta gratuita con acceso básico a entrenamientos.
      }
    </p>
  </ion-card-content>
</ion-card>
