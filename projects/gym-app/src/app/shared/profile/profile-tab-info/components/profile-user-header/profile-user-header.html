<ion-item lines="none">
  <ion-avatar slot="start">
    @if (user().photoURL) {
      <img [src]="user().photoURL" alt="Foto de perfil" />
    } @else {
      <ion-icon name="person-outline"></ion-icon>
    }
  </ion-avatar>
  <ion-label>
    <h2>{{ user().username || "" }}</h2>
  </ion-label>
  <ion-note slot="end">{{ user().userRole || "" }}</ion-note>
</ion-item>
