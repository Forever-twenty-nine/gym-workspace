<!-- KPIs -->
<ion-card>
  <ion-card-content>
    <ion-grid>
      <ion-row>
        <ion-col size="4">
          <ion-card color="light">
            <ion-text>{{ stats().entrenadosAsignados }}</ion-text>
            <ion-text>Entrenados</ion-text>
          </ion-card>
        </ion-col>
        <ion-col size="4">
          <ion-card color="success">
            <ion-text>{{ stats().rutinasCreadas }}</ion-text>
            <ion-text>Rutinas</ion-text>
          </ion-card>
        </ion-col>
        <ion-col size="4">
          <ion-card color="warning">
            <ion-text>{{ stats().ejerciciosCreados }}</ion-text>
            <ion-text>Ejercicios</ion-text>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>

<!-- Actividad 7 días -->
<ion-card>
  <ion-card-header>
    <ion-card-title>Actividad de tus alumnos (7 días)</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <apx-chart
      [series]="chartOptions().series"
      [chart]="chartOptions().chart"
      [dataLabels]="chartOptions().dataLabels"
      [plotOptions]="chartOptions().plotOptions"
      [xaxis]="chartOptions().xaxis"
      [yaxis]="chartOptions().yaxis"
      [colors]="chartOptions().colors"
      [theme]="chartOptions().theme"
    ></apx-chart>
  </ion-card-content>
</ion-card>
