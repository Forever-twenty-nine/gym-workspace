<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goToLogin()">
        <ion-icon name="arrow-back-outline" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-auth-background [showBlur]="true"></app-auth-background>

  <!-- content -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>
        Recuperar Contraseña
      </ion-card-title>
      <ion-card-subtitle>
        Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña.
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>

      <form [formGroup]="forgotForm">
        <ion-row>
          <ion-col>
            <ion-input label="Email" label-placement="floating" type="email" formControlName="email"
              placeholder="Ingresa tu email" [clearInput]="true" [errorText]="emailError">
            </ion-input>
          </ion-col>
        </ion-row>

        <ion-button expand="block" fill="solid" shape="round" color="primary" (click)="resetPassword()">
          Enviar Enlace
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
