<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goToWelcome()">
        <ion-icon name="arrow-back-outline" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">

  <app-auth-background [showBlur]="true"></app-auth-background>

  <ion-card>
    <ion-card-header>
      <ion-card-title>
        Regístrate
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form [formGroup]="registerForm">
        <ion-row>
          <ion-col>
            <ion-input label="Email" label-placement="floating" type="email" formControlName="email"
              placeholder="Ingresa tu email" [errorText]="emailError">
            </ion-input>
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-col>
            <ion-input label="Contraseña" label-placement="floating" type="password" formControlName="password"
              placeholder="Ingresa una contraseña" [errorText]="passwordError">
            </ion-input>
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-col>
            <ion-input label="Confirmar Contraseña" label-placement="floating" type="password"
              formControlName="confirmPassword" placeholder="Repite tu contraseña"
              [errorText]="confirmPasswordError">
            </ion-input>
          </ion-col>
        </ion-row>

        <ion-button expand="block" fill="solid" shape="round" color="primary" (click)="register()">
          Crear Cuenta
        </ion-button>
      </form>
      <ion-row>
        <ion-text>
          o regístrate con
        </ion-text>
        <ion-button fill="outline" shape="round" color="medium" (click)="loginWithGoogle()">
          <ion-icon src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" slot="start"></ion-icon>
          Google
        </ion-button>
      </ion-row>

      <ion-row>
        <p>
          ¿Ya tienes una cuenta?
        </p>
        <ion-button fill="clear" size="small" color="primary" (click)="goToLogin()">
          Inicia Sesión
        </ion-button>
      </ion-row>

    </ion-card-content>
  </ion-card>

</ion-content>
