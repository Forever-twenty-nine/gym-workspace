<ion-content [fullscreen]="true">
  <app-auth-background [showBlur]="false"></app-auth-background>

  <!-- content -->
  <ion-card>
    <ion-card-header>
      <img src="/assets/images/logo.png" width="100" height="100" alt="Fondo" />
      <ion-card-title>
        <span>Entrenamientos</span><br>
        diseñados sólo para ti!
      </ion-card-title>
      <ion-card-subtitle>
        Sigue un plan personalizado adaptado a tus objetivos, nivel fitness y preferencias.
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>

      <ion-button expand="block" fill="solid" shape="round" color="primary" (click)="goToRegister()">
        Regístrate
      </ion-button>

      <ion-row>
        <p>
          ¿Tienes una cuenta?
        </p>
        <ion-button fill="clear" (click)="goToLogin()">
          Iniciar Sesión
        </ion-button>
      </ion-row>
    </ion-card-content>
  </ion-card>
</ion-content>
