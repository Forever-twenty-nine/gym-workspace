<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goToWelcome()">
        <ion-icon name="arrow-back-outline" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-auth-background [showBlur]="true"></app-auth-background>

  <!-- content -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>
        Bienvenido a GymApp
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <form [formGroup]="loginForm">
        <ion-row>
          <ion-col>
            <ion-input label="Email" label-placement="floating" type="email" formControlName="email"
              placeholder="Ingresa tu email" [errorText]="emailError">
            </ion-input>
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-col>
            <ion-input label="Contraseña" label-placement="floating" type="password" formControlName="password"
              placeholder="Ingresa tu contraseña" [errorText]="passwordError">
            </ion-input>
          </ion-col>
        </ion-row>

        <ion-row>
          <ion-checkbox formControlName="rememberMe" label-placement="end" justify="start">
            Recordar mi contraseña
          </ion-checkbox>
        </ion-row>

        <ion-button expand="block" fill="solid" shape="round" color="primary" (click)="login()"
          [disabled]="isSubmitDisabled()">
          Iniciar Sesión
        </ion-button>
      </form>

      <ion-row>
        <ion-text>
          o inicia sesión con:
        </ion-text>

        <ion-button expand="block" fill="outline" shape="round" color="primary" (click)="loginWithGoogle()">
          <ion-icon src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" slot="start"></ion-icon>
          <span>oogle</span>
        </ion-button>
      </ion-row>
      
      <ion-row>
        <p>
          ¿No tienes una cuenta?
        </p>
        <ion-button fill="clear" size="small" color="primary" (click)="goToRegister()">
          Regístrate
        </ion-button>
      </ion-row>
      
      <ion-row>
        <p>
          ¿Olvidaste tu contraseña?
        </p>
        <ion-button fill="clear" size="small" color="primary" (click)="goToForgotPassword()">
          Recuperar Contraseña
        </ion-button>
      </ion-row>

    </ion-card-content>
  </ion-card>
</ion-content>
