<ion-card>
  <ion-card-content>
    @if (items().length > 0) {
      <ion-list lines="none">
        @for (item of items(); track item.convocatoria.id) {
          @if (canDelete()) {
            <ion-item-sliding #slidingItem>
              <ion-item>
                <app-date-badge slot="start" [fecha]="item.convocatoria.fechaEntrenamiento"></app-date-badge>
                <ion-label>
                  <h2>{{ item.convocatoria.titulo }}</h2>
                  @if (item.convocatoria.esSemanal) {
                    <p>Semanal</p>
                  }
                </ion-label>
              </ion-item>

              <ion-item-options side="start">
                <ion-item-option color="danger" (click)="onEliminar(item.convocatoria.id); slidingItem.close()">
                  <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
                </ion-item-option>
              </ion-item-options>

              <ion-item-options side="end">
                <ion-item-option color="primary" (click)="onEditar(item.convocatoria); slidingItem.close()">
                  <ion-icon name="pencil-outline" slot="icon-only"></ion-icon>
                </ion-item-option>
              </ion-item-options>
            </ion-item-sliding>
          } @else {
            <app-convocatoria-card
              [convocatoria]="item.convocatoria"
              [creadorName]="item.creadorName"
              [creadorPhoto]="item.creadorPhoto"
              [fechaFormateada]="item.fechaFormateada"
              [asistentes]="item.asistentes"
              [canDelete]="false">
            </app-convocatoria-card>
          }
        }
      </ion-list>
    } @else {
      <ion-text color="medium">
        <h3>{{ emptyTitle() }}</h3>
        <p>{{ emptyMessage() }}</p>
        <ion-icon [name]="emptyIcon()" color="medium"></ion-icon>
      </ion-text>
    }
  </ion-card-content>
</ion-card>
