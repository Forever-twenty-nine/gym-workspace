<ion-header>
  <ion-toolbar>
    <ion-segment [value]="segmentoActivo()" (ionChange)="cambiarSegmento($event)" mode="ios">
      <ion-segment-button value="oficial">
        <ion-label>Oficial</ion-label>
      </ion-segment-button>
      <ion-segment-button value="atletas">
        <ion-label>Propuestas de Atletas</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <app-background />

  <ion-grid>
    <!-- Contenido de Convocatorias Oficiales (WODs) -->
    @if (segmentoActivo() === 'oficial') {
      <ion-row>
        <ion-col>
          <app-convocatoria-list
            [items]="mappedConvocatoriasOficiales()"
            [canDelete]="true"
            emptyTitle="Agenda vacía"
            emptyMessage="No tienes entrenamientos o WODs planificados para hoy o mañana."
            emptyIcon="calendar-outline"
            (eliminar)="confirmarEliminacion($event)"
            (editar)="abrirEditarModal($event)">
          </app-convocatoria-list>
        </ion-col>
      </ion-row>
    }

    <!-- Contenido de Convocatorias de Atletas (Propuestas) -->
    @if (segmentoActivo() === 'atletas') {
      <ion-row>
        <ion-col>
          <app-convocatoria-list
            [items]="mappedConvocatoriasAtletas()"
            [canDelete]="false"
            emptyTitle="Sin propuestas"
            emptyMessage="No hay convocatorias activas publicadas por tus alumnos por el momento."
            emptyIcon="hand-right-outline">
          </app-convocatoria-list>
        </ion-col>
      </ion-row>
    }
  </ion-grid>

  <!-- FAB de crear (esquina inferior derecha) -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="abrirCrearModal()" color="primary">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- Modal Component para Crear/Editar Sesión de Agenda -->
  <app-crear-agenda-modal
    [isOpen]="isCrearModalOpen()"
    [convocatoria]="modalDataConvocatoria()"
    [isCreating]="isCreatingModal()"
    (close)="cerrarCrearModal()"
    (saved)="onSesionSaved()">
  </app-crear-agenda-modal>

</ion-content>
