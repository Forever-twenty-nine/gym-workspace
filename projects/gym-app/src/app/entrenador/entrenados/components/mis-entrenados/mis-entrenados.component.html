<ion-card>
  <ion-card-content>
    @if (entrenados().length > 0) {
      <ion-list lines="none">
        @for (entrenado of entrenados(); track entrenado.id) {
          <ion-item-sliding #slidingItem>
            <!-- Item principal que muestra el nombre del entrenado y su objetivo -->
            <ion-item>
              <ion-avatar slot="start">
                <img [src]="entrenado.photoURL || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + entrenado.id" />
              </ion-avatar>
              <ion-label>
                <h2>{{ entrenado.nombre }}</h2>
              </ion-label>
              <ion-note slot="end">
                {{ entrenado.objetivo }}
              </ion-note>
            </ion-item>

            <!-- Opciones al deslizar el item -->
            <ion-item-options side="end">
              <ion-item-option color="secondary" (click)="openRutinasModal.emit(entrenado.entrenado)">
                <ion-icon slot="icon-only" name="barbell-outline"></ion-icon>
              </ion-item-option>
              <ion-item-option color="primary" (click)="verCliente.emit(entrenado.entrenado)">
                <ion-icon slot="icon-only" name="eye-outline"></ion-icon>
              </ion-item-option>
            </ion-item-options>

            <ion-item-options side="start">
              <ion-item-option color="danger" (click)="desasociar.emit(entrenado.entrenado); slidingItem.close()">
                <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
              </ion-item-option>
            </ion-item-options>
          </ion-item-sliding>
        }
      </ion-list>
    } @else {
      <ion-text color="medium">
        <p class="ion-text-center">
          <em>Aún no tienes entrenados asociados.</em><br>
          <small>Usa el botón "+" para invitar a uno.</small>
        </p>
      </ion-text>
    }
  </ion-card-content>
</ion-card>
