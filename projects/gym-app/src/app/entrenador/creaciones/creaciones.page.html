<ion-header>
  <ion-toolbar>
    <ion-segment [value]="selectedTab()" (ionChange)="segmentChanged($event)" mode="ios">
      <ion-segment-button value="rutinas">
        <ion-label>Rutinas</ion-label>
      </ion-segment-button>
      <ion-segment-button value="ejercicios">
        <ion-label>Ejercicios</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-background />

  @switch (selectedTab()) {
    @case ('rutinas') {
      <app-rutinas></app-rutinas>
    }
    @case ('ejercicios') {
      <app-ejercicios></app-ejercicios>
    }
  }

  <app-help-fab [helpText]="helpText()" />

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="onFabCreate()" color="primary">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
