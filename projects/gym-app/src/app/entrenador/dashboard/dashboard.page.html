<ion-content [fullscreen]="true" class="transparent-bg">

  <app-background />

  <ion-grid fixed class="dashboard-container ion-padding">
    <!-- PRÓXIMOS ENTRENAMIENTOS -->
    <ion-row class="ion-margin-bottom">
      <ion-col class="ion-no-padding">
        <app-proximos-entrenados
          [entrenados]="entrenadosConRutinasProximas()"
          [getUserName]="getUserName.bind(this)">
        </app-proximos-entrenados>
      </ion-col>
    </ion-row>

    <!-- GESTIÓN DE TIPOS DE ENCUENTRO -->
    <ion-row>
      <ion-col class="ion-no-padding">
        <app-tipos-entrenamiento-manager></app-tipos-entrenamiento-manager>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
