<ion-header>
  <ion-toolbar color="transparent">
    <ion-title>Hola, {{ entrenador().nombre }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-background />

  <ion-grid fixed>
    <!-- PRÓXIMOS ENTRENAMIENTOS -->
    <ion-row>
      <ion-col>
        <app-proximos-entrenados
          [entrenados]="entrenadosConRutinasProximas()"
          [getUserName]="getUserName.bind(this)">
        </app-proximos-entrenados>
      </ion-col>
    </ion-row>

    <!-- GESTIÓN DE TIPOS DE ENCUENTRO -->
    <ion-row>
      <ion-col>
        <app-tipos-entrenamiento-manager></app-tipos-entrenamiento-manager>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
