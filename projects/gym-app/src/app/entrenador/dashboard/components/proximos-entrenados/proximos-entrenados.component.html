@if (entrenados().length > 0) {
<div class="ion-padding">
  <div class="ion-text-center ion-padding-bottom">
    <ion-text class="ion-text-uppercase">
      <h6><strong>PRÓXIMOS 3 DÍAS</strong></h6>
    </ion-text>
    <ion-text color="medium">
      <p><small>Entrenados con rutinas programadas en los siguientes 3 días</small></p>
    </ion-text>
  </div>
  <ion-list lines="none">
    @for (entrenado of entrenados(); track entrenado.id) {
    <div class="gym-sliding-item">
      <ion-item>
        <ion-avatar slot="start">
          <img [src]="entrenado.photoURL || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + entrenado.id" />
        </ion-avatar>
        <ion-label>
          <h3><strong>{{ getUserName()(entrenado.id) }}</strong></h3>
          <p class="ion-text-nowrap">{{ entrenado.nombreRutina }}</p>
        </ion-label>
      </ion-item>
    </div>
    }
  </ion-list>
</div>
} @else {
<ion-card class="ion-text-center ion-padding ion-margin">
  <ion-card-content>
    <ion-icon name="calendar-outline" style="font-size: 64px; opacity: 0.2;" class="ion-margin-bottom"></ion-icon>
    <p>No hay rutinas asignadas para los próximos 3 días.</p>
  </ion-card-content>
</ion-card>
}
