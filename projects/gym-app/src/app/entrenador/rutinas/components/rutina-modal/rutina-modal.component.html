<app-edit-modal
    [isOpen]="isOpen()"
    [title]="isCreating() ? 'Crear Rutina' : 'Editar Rutina'"
    [disabled]="isSaveDisabled()"
    [breakpoints]="[0, 0.9]"
    [initialBreakpoint]="0.9"
    (close)="close.emit()"
    (save)="handleSave()">

    <form [formGroup]="form()" (ngSubmit)="handleSave()">
        <ion-list lines="none">

            <ion-item>
                <ion-input label="Nombre" labelPlacement="stacked" formControlName="nombre"
                    placeholder="Nombre de la rutina"></ion-input>
            </ion-item>

            <ion-item>
                <ion-textarea label="Descripción" labelPlacement="stacked" formControlName="descripcion"
                    placeholder="Descripción de la rutina..." rows="3"></ion-textarea>
            </ion-item>

            <ion-item>
                <ion-select label="Ejercicios" labelPlacement="stacked" formControlName="ejerciciosIds" multiple
                    cancelText="Cancelar" okText="Aceptar">
                    @for (ejercicio of ejercicios(); track ejercicio.id) {
                    <ion-select-option [value]="ejercicio.id">
                        {{ ejercicio.nombre }} ({{ ejercicio.series }}x{{ ejercicio.repeticiones }})
                    </ion-select-option>
                    }
                </ion-select>
            </ion-item>

            <ion-item>
                <ion-select
                    label="Días de la semana"
                    labelPlacement="stacked"
                    formControlName="diasSemana"
                    multiple
                    cancelText="Cancelar"
                    okText="Aceptar"
                    placeholder="Selecciona los días">
                    @for (dia of diasSemana(); track dia) {
                    <ion-select-option [value]="dia">{{ dia }}</ion-select-option>
                    }
                </ion-select>
            </ion-item>
        </ion-list>
    </form>
</app-edit-modal>
