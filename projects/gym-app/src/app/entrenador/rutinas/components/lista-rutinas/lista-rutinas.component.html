<ion-card>
  <ion-card-content>
    @if (rutinas().length > 0) {
      <ion-list lines="none">
        @for (rutina of rutinas(); track rutina.id) {
          <ion-item-sliding #slidingItem>
            <ion-item>
              <ion-label>
                <h2>{{ rutina.nombre }}</h2>
              </ion-label>
              @if (rutina.ejerciciosIds?.length || rutina.ejercicios?.length) {
                <ion-note slot="end">
                  {{ (rutina.ejerciciosIds || rutina.ejercicios).length }} ej.
                </ion-note>
              }
            </ion-item>

            <ion-item-options side="start">
              <ion-item-option color="danger" (click)="deleteRutina.emit(rutina.id); slidingItem.close()">
                <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
              </ion-item-option>
            </ion-item-options>

            <ion-item-options side="end">
              <ion-item-option color="primary" (click)="verRutina.emit(rutina); slidingItem.close()">
                <ion-icon name="pencil-outline" slot="icon-only"></ion-icon>
              </ion-item-option>
            </ion-item-options>
          </ion-item-sliding>
        }
      </ion-list>
    } @else {
      <app-empty-state
        title="Aún no has creado rutinas."
        message="Usa el botón + para agregar una." />
    }
  </ion-card-content>
</ion-card>
