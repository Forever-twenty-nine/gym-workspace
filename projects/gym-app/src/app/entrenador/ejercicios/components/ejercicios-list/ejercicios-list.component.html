<ion-card>
  <ion-card-content>
    @if (ejercicios.length > 0) {
      <ion-list lines="none">
        @for (ejercicio of ejercicios; track ejercicio.id) {
          <ion-item-sliding #slidingItem>
            <ion-item>
              <ion-label>
                <h2>{{ ejercicio.nombre }}</h2>
              </ion-label>
              <ion-note slot="end">
                {{ ejercicio.series }}x{{ ejercicio.repeticiones }}@if(ejercicio.peso) { ({{ ejercicio.peso }}kg)}
              </ion-note>
            </ion-item>

            <ion-item-options side="start">
              <ion-item-option color="danger" (click)="onEliminar(ejercicio.id); slidingItem.close()">
                <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
              </ion-item-option>
            </ion-item-options>

            <ion-item-options side="end">
              <ion-item-option color="primary" (click)="onVer(ejercicio); slidingItem.close()">
                <ion-icon name="pencil-outline" slot="icon-only"></ion-icon>
              </ion-item-option>
            </ion-item-options>
          </ion-item-sliding>
        }
      </ion-list>
    } @else {
      <ion-text color="medium">
        <p class="ion-text-center">
          <em>Aún no has creado ejercicios.</em><br>
          <small>Usa el botón "+" para agregar uno.</small>
        </p>
      </ion-text>
    }
  </ion-card-content>
</ion-card>
