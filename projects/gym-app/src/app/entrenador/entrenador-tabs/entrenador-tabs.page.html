<ion-tabs>
  <ion-tab-bar slot="bottom" style="height: 44px; min-height: 44px; --background: var(--ion-background-color, #fff); border-top: 1px solid var(--ion-color-step-100, #f4f5f8);">
    
    <!-- Tab de Dashboard -->
    <ion-tab-button tab="dashboard" href="/entrenador-tabs/dashboard">
      <ion-icon name="stats-chart-outline"></ion-icon>
    </ion-tab-button>

    <!-- Tab de Entrenados -->
    <ion-tab-button tab="entrenados" href="/entrenador-tabs/entrenados">
      <ion-icon name="people-outline"></ion-icon>
    </ion-tab-button>

    <!-- Tab de Agenda -->
    <ion-tab-button tab="agenda" href="/entrenador-tabs/agenda">
      <ion-icon name="calendar-outline"></ion-icon>
    </ion-tab-button>

    <!-- Tab de Creaciones (Acciones - Siempre visible) -->
    <ion-tab-button tab="creaciones" href="/entrenador-tabs/creaciones">
      <ion-icon name="add-circle-outline" style="font-size: 26px;"></ion-icon>
    </ion-tab-button>

    <!-- Tab de Perfil -->
    <ion-tab-button tab="perfil" href="/entrenador-tabs/perfil">
      <ion-icon name="person-outline"></ion-icon>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
